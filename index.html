<style>

img{ max-width:100%; display:block; }

.hidden{ display:none !important; }
.flex{ display:flex; }
.flex-col{ flex-direction:column; }
.flex-1{ flex:1 1 0%; }

.text-xl{font-size:21px;} .text-2xl{font-size:26px;} .text-3xl{font-size:32px;} .text-5xl{font-size:48px;}

.overflow-x-auto{overflow-x:auto;} .overflow-y-auto{overflow-y:auto;}

.h-4{height:16px;} .h-5{height:20px;} .h-6{height:24px;} .h-8{height:32px;} .h-16{height:64px;} .h-20{height:80px;}

.thumb{ position:relative; flex-shrink:0; width:80px; height:80px; border-radius:14px; overflow:hidden; border:1px solid var(--line); }
.thumb img{ width:100%; height:100%; object-fit:cover; }
.thumb .rm{ position:absolute; top:2px; right:2px; width:24px; height:24px; border-radius:999px; background:rgba(0,0,0,0.6); color:#fff; font-size:12px; border:none; }

.pinpad{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:280px; margin:0 auto; }

.modal-box{ background:#fff; width:100%; max-width:480px; border-radius:28px 28px 0 0; max-height:88vh; overflow-y:auto; padding:20px; }
@media(min-width:640px){ .modal-overlay{ align-items:center; } .modal-box{ border-radius:28px; } }
.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:96px; z-index:999; padding:12px 16px; border-radius:14px; background:var(--navy); color:#fff; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,0.25); max-width:90%; text-align:center; }
.header-app{ background:var(--sage-dark); padding:12px 16px; display:flex; align-items:center; gap:12px; box-shadow:0 1px 4px rgba(0,0,0,0.1); }

.navbtn.active{ color:var(--sage-dark); font-weight:700; }
.install-bar{ background:var(--sage-dark); color:#fff; }

  .no-print{ display:none !important; }
  body{ background:#fff; }

</head>
<body>
<div id="app">
  <noscript>
    <div style="padding:24px;text-align:center;">JavaScriptを有効にしてください。</div>
  </noscript>
</div>

<script>
(function(){
"use strict";

/* ========================= 安全なストレージ ========================= */
var memoryStore = {};
var storageAvailable = true;
var storage = {
  get: function(key, fallback){
    try{
      var v = localStorage.getItem(key);
      if(v === null) return (key in memoryStore) ? memoryStore[key] : fallback;
      return JSON.parse(v);
    }catch(e){
      return (key in memoryStore) ? memoryStore[key] : fallback;
    }
  },
  set: function(key, value){
    try{
      localStorage.setItem(key, JSON.stringify(value));
    }catch(e){
      storageAvailable = false;
    }
    memoryStore[key] = value;
  }
};
var STORE_KEY = 'sonaelog_data_v1';

function uid(){ try{ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }catch(e){ return 'id'+Math.floor(Math.random()*1e9); } }
function todayISO(){ try{ return new Date().toISOString().slice(0,10); }catch(e){ return '2026-01-01'; } }
function fmtDateJP(iso){
  try{
    if(!iso) return '';
    var d = new Date(iso);
    if(isNaN(d.getTime())) return iso;
    return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
  }catch(e){ return iso || ''; }
}
function escapeHtml(s){
  if(s === undefined || s === null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
  });
}

var HOUSE_CHECKLIST_DEFAULT = ['家具の固定','ガラスの飛散防止','脱出用ハンマーの設置','非常持ち出し袋の準備','消火器の設置'];
var CAR_CHECKLIST_DEFAULT = ['ガソリン半分以上をキープ','車内に飲料水を常備','非常用工具の積み込み','任意保険の証券を確認'];
var HOUSE_SHOT_GUIDE = ['建物 前から全体','建物 右から全体','建物 左から全体','建物 後ろから全体','こわれた場所（近づいて）','部屋の中のようす','水回り（台所・お風呂）'];
var CAR_SHOT_GUIDE = ['車 遠くから全体（タイヤが写るように）','水につかった高さがわかる写真','車内の足元（ぬれ具合）','メーターパネル','ナンバープレート'];
var PHONE_LIST = [
  { label:'警察', num:'110', icon:'🚓', note:'事件・事故のとき' },
  { label:'消防・救急', num:'119', icon:'🚒', note:'火事・急病のとき' },
  { label:'海上保安庁', num:'118', icon:'⚓', note:'海の事故のとき' },
  { label:'JAFロードサービス', num:'#8139', icon:'🚙', note:'車のトラブルのとき' },
  { label:'救急安心センター', num:'#7119', icon:'☎️', note:'救急車を呼ぶか迷ったとき' }
];
var DEFAULT_REMINDERS = [
  { id:'r-0117', label:'冬の備え点検日', date:'01-17', monthly:false, enabled:true, builtin:true },
  { id:'r-0311', label:'防災の日（3月）', date:'03-11', monthly:false, enabled:true, builtin:true },
  { id:'r-0416', label:'防災の日（4月）', date:'04-16', monthly:false, enabled:true, builtin:true },
  { id:'r-0901', label:'防災の日（9月）', date:'09-01', monthly:false, enabled:true, builtin:true },
  { id:'r-monthly', label:'毎月の点検日', date:'01', monthly:true, enabled:true, builtin:true }
];

function defaultData(){
  return {
    pin: null,
    cards: [],
    reminders: DEFAULT_REMINDERS.slice(),
    createdAt: todayISO()
  };
}
function loadData(){
  try{
    var d = storage.get(STORE_KEY, null);
    if(!d || typeof d !== 'object') return defaultData();
    var merged = {};
    var base = defaultData();
    for(var k in base){ merged[k] = (k in d) ? d[k] : base[k]; }
    if(!merged.reminders || !merged.reminders.length) merged.reminders = DEFAULT_REMINDERS.slice();
    if(!Array.isArray(merged.cards)) merged.cards = [];
    return merged;
  }catch(e){ return defaultData(); }
}
function saveData(){ try{ storage.set(STORE_KEY, state.data); }catch(e){} }

/* ========================= アプリ状態 ========================= */
var state = {
  data: loadData(),
  unlocked: false,
  setupStage: null,   // 'setup1' | 'setup2' | null
  firstPin: '',
  pinInput: '',
  pinError: '',
  changingPin: false,
  tab: 'home',
  openCardId: null,
  editingNameCardId: null,
  toastMsg: '',
  toastTimer: null,
  showInstallBar: false,
  showIOSInstallModal: false,
  deferredInstallPrompt: null,
  installDismissed: storage.get('sonaelog_install_dismissed', false),
  emergencyMode: null,     // 'house' | 'car' | null
  emergencyTarget: null,   // card id
  showFloodAlert: false,
  showReminderPopup: false,
  pendingReminders: [],
  showPrintGuide: false,
  reminderAddLabel: '',
  reminderAddDate: '',
  pendingCapture: null     // { cardId, kind: 'before'|'after' }
};

function setToast(msg){
  state.toastMsg = msg;
  render();
  try{ if(state.toastTimer) clearTimeout(state.toastTimer); }catch(e){}
  state.toastTimer = setTimeout(function(){ state.toastMsg=''; render(); }, 2600);
}

/* ========================= 画像圧縮 ========================= */
function compressImage(file, maxWidth, callback){
  try{
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var img = new Image();
        img.onload = function(){
          try{
            var w = img.width, h = img.height;
            if(w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
            var canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            var dataUrl = canvas.toDataURL('image/jpeg', 0.78);
            callback(null, dataUrl);
          }catch(err){ callback(err); }
        };
        img.onerror = function(){ callback(new Error('image load error')); };
        img.src = e.target.result;
      }catch(err){ callback(err); }
    };
    reader.onerror = function(){ callback(new Error('file read error')); };
    reader.readAsDataURL(file);
  }catch(e){ callback(e); }
}

/* ========================= カード操作 ========================= */
function findCard(id){
  for(var i=0;i<state.data.cards.length;i++){ if(state.data.cards[i].id===id) return state.data.cards[i]; }
  return null;
}
function addCard(type){
  var defaults = type==='house' ? HOUSE_CHECKLIST_DEFAULT : CAR_CHECKLIST_DEFAULT;
  var checklist = defaults.map(function(label){ return { id: uid(), label: label, checked:false }; });
  var card = { id: uid(), type: type, name: type==='house' ? '我が家' : 'マイカー', checklist: checklist, beforePhotos: [], afterPhotos: [] };
  state.data.cards.push(card);
  saveData();
  render();
}
function removeCard(id){
  state.data.cards = state.data.cards.filter(function(c){ return c.id!==id; });
  saveData(); render();
}

/* ========================= リマインダー判定 ========================= */
function getTodaysReminders(reminders){
  try{
    var now = new Date();
    var mm = String(now.getMonth()+1).padStart(2,'0');
    var dd = String(now.getDate()).padStart(2,'0');
    return reminders.filter(function(r){
      if(!r.enabled) return false;
      if(r.monthly) return dd === '01';
      return r.date === (mm+'-'+dd);
    });
  }catch(e){ return []; }
}

/* ========================= レンダリング ========================= */
var root;

function render(){
  try{
    root = document.getElementById('app');
    if(!root) return;
    if(!state.unlocked){
      root.innerHTML = renderLockScreen();
    } else if(state.changingPin){
      root.innerHTML = renderChangePinScreen();
    } else {
      root.innerHTML = renderMainApp();
    }
    attachEvents();
  }catch(e){
    try{
      root = root || document.getElementById('app');
      if(root){
        root.innerHTML = '<div style="padding:32px;text-align:center;color:#2C3E50;">' +
          '<p style="font-size:20px;font-weight:700;margin-bottom:12px;">🛡️ ソナエログ</p>' +
          '<p style="font-size:14px;">画面の表示中に問題が発生しました。下のボタンで再読み込みしてください。</p>' +
          '<button id="__reload_btn" style="margin-top:16px;padding:12px 24px;border-radius:16px;background:#5F7A63;color:#fff;font-weight:700;border:none;">再読み込み</button>' +
          '</div>';
        var b = document.getElementById('__reload_btn');
        if(b) b.addEventListener('click', function(){ try{ location.reload(); }catch(e2){} });
      }
    }catch(e2){}
  }
}

/* ---------- ロック画面 ---------- */
function renderPinDots(){
  var dots = '';
  for(var i=0;i<4;i++){
    dots += '<span class="pindot" style="background:' + (state.pinInput.length>i ? 'var(--sage)' : 'transparent') + '"></span> ';
  }
  return '<div class="flex justify-center gap-3 mb-4">' + dots + '</div>';
}
function renderPinPad(){
  var keys = ['1','2','3','4','5','6','7','8','9'];
  var html = '<div class="pinpad">';
  keys.forEach(function(k){ html += '<button class="pinkey press" data-action="pin-digit" data-digit="'+k+'">'+k+'</button>'; });
  html += '<div></div>';
  html += '<button class="pinkey press" data-action="pin-digit" data-digit="0">0</button>';
  html += '<button class="pinkey press" data-action="pin-backspace" style="font-size:20px;">⌫</button>';
  html += '</div>';
  return html;
}
function renderLockScreen(){
  var stage = state.setupStage;
  if(state.data.pin === null && !stage) stage = state.setupStage = 'setup1';
  if(stage === 'setup1' || stage === 'setup2'){
    return (
      '<div class="flex flex-col items-center justify-center safe-top safe-bottom" style="min-height:100vh;padding:24px;">' +
        '<div class="text-5xl mb-2">🛡️</div>' +
        '<h1 class="text-2xl font-bold mb-1">ソナエログ</h1>' +
        '<p class="text-sm opacity-60 mb-6">そなえあればうれしいアプリ</p>' +
        '<div class="card p-6 w-full max-w-sm">' +
          '<p class="font-bold text-center mb-4">' + (stage==='setup1' ? '合言葉となる4つの数字を決めてください' : 'もう一度、同じ数字を入力してください') + '</p>' +
          (state.pinError ? '<p class="pin-error text-center mb-2">'+escapeHtml(state.pinError)+'</p>' : '') +
          renderPinDots() + renderPinPad() +
        '</div>' +
      '</div>'
    );
  }
  return (
    '<div class="flex flex-col items-center justify-center safe-top safe-bottom" style="min-height:100vh;padding:24px;">' +
      '<div class="text-5xl mb-2">🔒</div>' +
      '<h1 class="text-2xl font-bold mb-6">ソナエログ</h1>' +
      '<div class="card p-6 w-full max-w-sm">' +
        '<p class="font-bold text-center mb-4">合言葉の数字を入力してください</p>' +
        (state.pinError ? '<p class="pin-error text-center mb-2">'+escapeHtml(state.pinError)+'</p>' : '') +
        renderPinDots() + renderPinPad() +
      '</div>' +
    '</div>'
  );
}
function renderChangePinScreen(){
  return (
    '<div class="flex flex-col items-center justify-center safe-top safe-bottom" style="min-height:100vh;padding:24px;">' +
      '<div class="card p-6 w-full max-w-sm">' +
        '<p class="font-bold text-center mb-4">新しい合言葉を入力してください</p>' +
        renderPinDots() + renderPinPad() +
        '<button class="btn btn-ghost w-full mt-3 press" data-action="cancel-change-pin">やめる</button>' +
      '</div>' +
    '</div>'
  );
}

/* ---------- フッター（必須共通要素） ---------- */
function renderFooter(){
  return (
    '<footer style="text-align:center;font-size:0.75rem;color:#888;margin-top:3rem;padding:1rem 0.5rem 1.5rem;line-height:1.5;">' +

/* ---------- インストール案内バー ---------- */
function isIOSDevice(){
  try{
    return /iphone|ipad|ipod/i.test(window.navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }catch(e){ return false; }
}
function isStandaloneDisplay(){
  try{
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  }catch(e){ return false; }
}
function renderInstallBar(){
  if(isStandaloneDisplay() || state.installDismissed) return '';
  var ios = isIOSDevice();
  if(!state.deferredInstallPrompt && !ios) return '';
  return (
    '<div class="no-print install-bar safe-top">' +
      '<div class="flex items-center justify-between gap-2" style="padding:8px 16px;font-size:13px;">' +
        '<span>📲 ホーム画面に追加すると、もっと使いやすくなります</span>' +

          '<button class="press tapbtn pill" style="background:rgba(255,255,255,0.9);color:var(--sage-dark);padding:6px 12px;font-weight:700;border:none;font-size:13px;" data-action="install-app">追加する</button>' +
          '<button class="press tapbtn" style="background:transparent;border:none;color:rgba(255,255,255,0.8);font-size:20px;padding:0 6px;" data-action="dismiss-install">×</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

      '<button class="btn btn-sage w-full press" data-action="export-data">データを保存する（ダウンロード）</button>' +
      '<button class="btn btn-outline w-full press" data-action="trigger-import">データを読み込む（復元）</button>' +
    '</section>'
  );

  html += '</div>';
  return html;
}

/* ---------- リマインダー通知ポップアップ ---------- */
function renderReminderPopup(){
  if(!state.showReminderPopup) return '';
  var list = '<ul class="text-sm" style="padding-left:20px;list-style:disc;">';
  state.pendingReminders.forEach(function(r){ list += '<li>'+escapeHtml(r.label)+'</li>'; });
  list += '</ul>';
  return renderModal('reminder-popup', '『ソナエログ』の点検日です',
    '<div class="space-y-4">' +
      '<p class="text-base font-bold">『ソナエログ』の点検日です。それぞれの項目について点検しましょう</p>' +
      list +
      '<button class="btn btn-sage w-full press" data-action="close-reminder-popup">点検する</button>' +
    '</div>'
  );
}

/* ---------- メインアプリ ---------- */
var TABS = [
  { key:'home', label:'ホーム', icon:'🏠' },
  { key:'emergency', label:'きんきゅう', icon:'⚠️' },
  { key:'summary', label:'まとめ', icon:'🗂️' },
  { key:'phone', label:'でんわ', icon:'☎️' },
  { key:'settings', label:'せってい', icon:'⚙️' }
];
function renderMainApp(){
  var viewHtml = '';
  try{
    if(state.tab==='home') viewHtml = renderHomeView();
    else if(state.tab==='emergency') viewHtml = renderEmergencyView();
    else if(state.tab==='summary') viewHtml = renderSummaryView();
    else if(state.tab==='phone') viewHtml = renderPhoneView();
    else if(state.tab==='settings') viewHtml = renderSettingsView();
    else viewHtml = renderHomeView();
  }catch(e){
    viewHtml = '<div style="padding:24px;text-align:center;">この画面の表示に失敗しました。他のタブをお試しください。</div>';
  }

  var navHtml = '<nav class="no-print navbar safe-bottom">';
  TABS.forEach(function(t){
    navHtml += '<button class="navbtn press'+(state.tab===t.key?' active':'')+'" data-action="switch-tab" data-tab="'+t.key+'"><span class="text-xl">'+t.icon+'</span><span class="text-xs" style="font-size:10px;">'+t.label+'</span></button>';
  });
  navHtml += '</nav>';

  var html = '<div class="flex flex-col" style="min-height:100vh;">';
  html += renderInstallBar();
  html += (
    '<header class="no-print header-app safe-top sticky top-0 z-40">' +
      '<span class="text-2xl">🛡️</span>' +
      '<div><h1 class="text-white font-black text-lg leading-tight">ソナエログ</h1><p class="leading-tight" style="color:rgba(255,255,255,0.7);font-size:11px;">そなえあればうれしいアプリ</p></div>' +
    '</header>'
  );
  html += '<main class="flex-1 mx-auto max-w-2xl" style="width:100%;">' + viewHtml + renderFooter() + '</main>';
  html += navHtml;
  html += '</div>';
  html += renderIOSInstallModal();
  html += renderReminderPopup();
  if(state.toastMsg) html += '<div class="toast fade-in">'+escapeHtml(state.toastMsg)+'</div>';

  // 隠しファイル入力（撮影・データ読み込み用）
  html += '<input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" />';
  html += '<input type="file" id="file-input" accept="image/*" class="hidden" />';
  html += '<input type="file" id="import-input" accept="application/json" class="hidden" />';
  return html;
}

/* ========================= イベント処理 ========================= */
function handlePinDigit(d){
  if(state.pinInput.length>=4) return;
  state.pinInput += d;
  if(state.pinInput.length===4){
    var entered = state.pinInput;
    setTimeout(function(){
      if(state.changingPin){
        state.data.pin = entered; saveData();
        state.changingPin = false; state.pinInput='';
        setToast('合言葉を変更しました');
        render();
        return;
      }
      if(!state.unlocked){
        if(state.setupStage==='setup1'){
          state.firstPin = entered; state.setupStage='setup2'; state.pinError=''; state.pinInput='';
          render();
        } else if(state.setupStage==='setup2'){
          if(entered===state.firstPin){
            state.data.pin = entered; saveData();
            state.unlocked = true; state.pinInput=''; state.setupStage=null;
            checkReminders();
            render();
          } else {
            state.pinError = '数字が違います。最初からやり直してください';
            state.setupStage='setup1'; state.pinInput='';
            render();
          }
        } else {
          if(entered === state.data.pin){
            state.unlocked = true; state.pinInput=''; state.pinError='';
            checkReminders();
            render();
          } else {
            state.pinError = '数字が違います'; state.pinInput='';
            render();
          }
        }
      }
    }, 120);
  }
  render();
}
function handlePinBackspace(){ state.pinInput = state.pinInput.slice(0,-1); render(); }

function checkReminders(){
  try{
    var key = 'sonaelog_last_reminder_check';
    var last = storage.get(key, '');
    var today = todayISO();
    var todays = getTodaysReminders(state.data.reminders);
    if(todays.length && last !== today){
      state.pendingReminders = todays;
      state.showReminderPopup = true;
      storage.set(key, today);
    }
  }catch(e){}
}

function tryCameraCapture(cardId, kind){
  state.pendingCapture = { cardId: cardId, kind: kind };
  var cam = document.getElementById('camera-input');
  var file = document.getElementById('file-input');
  try{
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      navigator.mediaDevices.getUserMedia({ video: true }).then(function(stream){
        try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
        try{ cam.click(); }catch(e){ if(file) file.click(); }
      }).catch(function(){
        setToast('カメラが使えないため、写真を選ぶ画面に切り替わります');
        setTimeout(function(){ try{ file.click(); }catch(e){} }, 900);
      });
    } else {
      setToast('カメラが使えないため、写真を選ぶ画面に切り替わります');
      setTimeout(function(){ try{ file.click(); }catch(e){} }, 900);
    }
  }catch(e){
    setToast('カメラが使えないため、写真を選ぶ画面に切り替わります');
    setTimeout(function(){ try{ file.click(); }catch(e){} }, 900);
  }
}
function handleCapturedFile(fileObj){
  if(!fileObj || !state.pendingCapture) return;
  var target = state.pendingCapture;
  compressImage(fileObj, 900, function(err, dataUrl){
    if(err){ setToast('写真の読み込みに失敗しました。もう一度お試しください'); return; }
    var card = findCard(target.cardId);
    if(!card){ return; }
    var photo = { id: uid(), dataUrl: dataUrl, date: todayISO() };
    if(target.kind==='before') card.beforePhotos.push(photo);
    else card.afterPhotos.push(photo);
    saveData();
    render();
  });
}

function exportData(){
  try{
    var blob = new Blob([JSON.stringify(state.data, null, 2)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'ソナエログ_おまもりデータ_' + todayISO() + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ document.body.removeChild(a); URL.revokeObjectURL(url); }catch(e){} }, 100);
    setToast('データを保存しました');
  }catch(e){
    setToast('保存に失敗しました。時間をおいてお試しください');
  }
}
function importDataFromFile(fileObj){
  if(!fileObj) return;
  try{
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var parsed = JSON.parse(e.target.result);
        if(!parsed || typeof parsed !== 'object') throw new Error('bad');
        var base = defaultData();
        var merged = {};
        for(var k in base){ merged[k] = (k in parsed) ? parsed[k] : base[k]; }
        if(!Array.isArray(merged.cards)) merged.cards = [];
        if(!merged.reminders || !merged.reminders.length) merged.reminders = DEFAULT_REMINDERS.slice();
        state.data = merged;
        saveData();
        setToast('データを読み込みました');
        render();
      }catch(err){
        setToast('読み込みに失敗しました。正しいファイルかご確認ください');
      }
    };
    reader.onerror = function(){ setToast('読み込みに失敗しました。正しいファイルかご確認ください'); };
    reader.readAsText(fileObj);
  }catch(e){
    setToast('読み込みに失敗しました。正しいファイルかご確認ください');
  }
}

/* ========================= イベント委譲 ========================= */
function attachEvents(){
  if(!root) return;

  root.onclick = function(e){
    try{
      var overlay = e.target.closest ? e.target.closest('[data-action="modal-overlay"]') : null;
      if(overlay && e.target === overlay){
        closeModalById(overlay.getAttribute('data-modal'));
        return;
      }
      var el = e.target.closest ? e.target.closest('[data-action]') : null;
      if(!el) return;
      var action = el.getAttribute('data-action');
      switch(action){
        case 'pin-digit': handlePinDigit(el.getAttribute('data-digit')); break;
        case 'pin-backspace': handlePinBackspace(); break;
        case 'cancel-change-pin': state.changingPin=false; state.pinInput=''; render(); break;
        case 'start-change-pin': state.changingPin=true; state.pinInput=''; render(); break;
        case 'reset-pin':
          if(confirm('合言葉をリセットします。次回起動時に新しく設定できます。よろしいですか？')){
            state.data.pin = null; saveData();
            try{ location.reload(); }catch(err){ state.unlocked=false; state.setupStage='setup1'; render(); }
          }
          break;
        case 'switch-tab':
          state.tab = el.getAttribute('data-tab');
          state.openCardId = null; state.editingNameCardId = null;
          render();
          break;
        case 'add-card': addCard(el.getAttribute('data-type')); break;
        case 'toggle-card-open':
          var cid = el.getAttribute('data-card');
          state.openCardId = (state.openCardId===cid) ? null : cid;
          state.editingNameCardId = null;
          render();
          break;
        case 'edit-card-name': state.editingNameCardId = el.getAttribute('data-card'); render(); break;
        case 'save-card-name': {
          var ccid = el.getAttribute('data-card');
          var input = root.querySelector('[data-role="card-name-input"][data-card="'+ccid+'"]');
          var card = findCard(ccid);
          if(card && input && input.value.trim()){ card.name = input.value.trim(); saveData(); }
          state.editingNameCardId = null;
          render();
          break;
        }
        case 'toggle-check': {
          var card2 = findCard(el.getAttribute('data-card'));
          if(card2){
            var itemId = el.getAttribute('data-item');
            card2.checklist = card2.checklist.map(function(it){ return it.id===itemId ? Object.assign({},it,{checked:!it.checked}) : it; });
            saveData();
          }
          render();
          break;
        }
        case 'remove-check': {
          var card3 = findCard(el.getAttribute('data-card'));
          if(card3){ card3.checklist = card3.checklist.filter(function(it){return it.id!==el.getAttribute('data-item');}); saveData(); }
          render();
          break;
        }
        case 'add-check': {
          var ccid2 = el.getAttribute('data-card');
          var input2 = root.querySelector('[data-role="new-check-input"][data-card="'+ccid2+'"]');
          var card4 = findCard(ccid2);
          if(card4 && input2 && input2.value.trim()){
            card4.checklist.push({ id: uid(), label: input2.value.trim(), checked:false });
            saveData();
          }
          render();
          break;
        }
        case 'delete-card': {
          var did = el.getAttribute('data-card');
          var c = findCard(did);
          if(c && confirm('「'+c.name+'」を削除しますか？写真も消えます')){ removeCard(did); if(state.openCardId===did) state.openCardId=null; }
          render();
          break;
        }
        case 'capture': tryCameraCapture(el.getAttribute('data-card'), el.getAttribute('data-kind')); break;
        case 'remove-photo-before': {
          var cb = findCard(el.getAttribute('data-card'));
          if(cb){ cb.beforePhotos = cb.beforePhotos.filter(function(p){return p.id!==el.getAttribute('data-photo');}); saveData(); }
          render();
          break;
        }
        case 'remove-photo-after': {
          var ca = findCard(el.getAttribute('data-card'));
          if(ca){ ca.afterPhotos = ca.afterPhotos.filter(function(p){return p.id!==el.getAttribute('data-photo');}); saveData(); }
          render();
          break;
        }
        case 'emergency-mode': {
          var t = el.getAttribute('data-type');
          state.emergencyMode = t; state.emergencyTarget = null;
          if(t==='car') state.showFloodAlert = true;
          render();
          break;
        }
        case 'emergency-select': state.emergencyTarget = el.getAttribute('data-card'); render(); break;
        case 'emergency-back': state.emergencyMode=null; state.emergencyTarget=null; render(); break;
        case 'close-flood-alert': state.showFloodAlert=false; render(); break;
        case 'print-page': try{ window.print(); }catch(e){} break;
        case 'show-print-guide': state.showPrintGuide=true; render(); break;
        case 'close-print-guide': state.showPrintGuide=false; render(); break;
        case 'toggle-reminder': {
          var rid = el.getAttribute('data-id');
          state.data.reminders = state.data.reminders.map(function(r){ return r.id===rid ? Object.assign({},r,{enabled:!r.enabled}) : r; });
          saveData(); render();
          break;
        }
        case 'remove-reminder': {
          var rid2 = el.getAttribute('data-id');
          state.data.reminders = state.data.reminders.filter(function(r){return r.id!==rid2;});
          saveData(); render();
          break;
        }
        case 'add-reminder': {
          var labelInput = document.getElementById('reminder-label-input');
          var dateInput = document.getElementById('reminder-date-input');
          if(labelInput && dateInput && labelInput.value.trim() && dateInput.value){
            var md = dateInput.value.slice(5);
            state.data.reminders.push({ id: uid(), label: labelInput.value.trim(), date: md, monthly:false, enabled:true, builtin:false });
            saveData();
          }
          render();
          break;
        }
        case 'export-data': exportData(); break;
        case 'trigger-import': { var ii = document.getElementById('import-input'); if(ii) ii.click(); break; }
        case 'install-app': {
          if(state.deferredInstallPrompt){
            try{
              state.deferredInstallPrompt.prompt();
              state.deferredInstallPrompt.userChoice.then(function(){
                state.deferredInstallPrompt = null;
                state.installDismissed = true; storage.set('sonaelog_install_dismissed', true);
                render();
              });
            }catch(e){}
          } else if(isIOSDevice()){
            state.showIOSInstallModal = true; render();
          }
          break;
        }
        case 'dismiss-install': state.installDismissed=true; storage.set('sonaelog_install_dismissed', true); render(); break;
        case 'close-ios-install': state.showIOSInstallModal=false; state.installDismissed=true; storage.set('sonaelog_install_dismissed', true); render(); break;
        case 'close-reminder-popup': state.showReminderPopup=false; render(); break;
        case 'close-modal': closeModalById(el.getAttribute('data-modal')); break;
      }
    }catch(err){ /* イベント処理エラーでも画面は維持する */ }
  };

  root.onchange = function(e){
    try{
      if(e.target.id === 'camera-input' || e.target.id === 'file-input'){
        var f = e.target.files && e.target.files[0];
        handleCapturedFile(f);
        e.target.value = '';
      } else if(e.target.id === 'import-input'){
        var f2 = e.target.files && e.target.files[0];
        importDataFromFile(f2);
        e.target.value = '';
      }
    }catch(err){}
  };

  root.onkeydown = function(e){
    try{
      if(e.key==='Enter'){
        if(e.target.getAttribute && e.target.getAttribute('data-role')==='new-check-input'){
          var cardId = e.target.getAttribute('data-card');
          var btn = root.querySelector('[data-action="add-check"][data-card="'+cardId+'"]');
          if(btn) btn.click();
        }
      }
    }catch(err){}
  };
}
function closeModalById(id){
  if(id==='flood-alert') state.showFloodAlert=false;
  else if(id==='print-guide') state.showPrintGuide=false;
  else if(id==='reminder-popup') state.showReminderPopup=false;
  else if(id==='ios-install'){ state.showIOSInstallModal=false; state.installDismissed=true; storage.set('sonaelog_install_dismissed', true); }
  render();
}

/* ========================= PWAインストールイベント ========================= */
try{
  window.addEventListener('beforeinstallprompt', function(e){
    try{
      e.preventDefault();
      state.deferredInstallPrompt = e;
      render();
    }catch(err){}
  });
}catch(e){}

/* ========================= 起動処理（DOM読み込み完了を待つ） ========================= */
function boot(){
  try{
    if(state.data && state.data.pin){ state.unlocked = false; }
    render();
  }catch(e){
    try{
      var r = document.getElementById('app');
      if(r) r.innerHTML = '<div style="padding:32px;text-align:center;">🛡️ ソナエログ<br/>読み込みに問題が発生しました。再読み込みしてください。</div>';
    }catch(e2){}
  }

  try{
    if('serviceWorker' in navigator){
      window.addEventListener('load', function(){
        navigator.serviceWorker.register('./sw.js').catch(function(){ /* 失敗してもアプリ本体は動作継続 */ });
      });
    }
  }catch(e){}
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
