const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ============== ストレージ（localStorage + メモリフォールバック） ============== */
const memoryStore = {};
const storage = {
  get(key, fallback){
    try{
      const v = localStorage.getItem(key);
      if(v === null) return fallback;
      return JSON.parse(v);
    }catch(e){
      return (key in memoryStore) ? memoryStore[key] : fallback;
    }
  },
  set(key, value){
    try{
      localStorage.setItem(key, JSON.stringify(value));
    }catch(e){
      memoryStore[key] = value;
    }
  }
};
const STORE_KEY = 'sonaelog_data_v1';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function fmtDateJP(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

const DEFAULT_REMINDERS = [
  { id:'r-0117', label:'冬の備え点検日', date:'01-17', monthly:false, enabled:true, builtin:true },
  { id:'r-0311', label:'防災の日（3月）', date:'03-11', monthly:false, enabled:true, builtin:true },
  { id:'r-0416', label:'防災の日（4月）', date:'04-16', monthly:false, enabled:true, builtin:true },
  { id:'r-0901', label:'防災の日（9月）', date:'09-01', monthly:false, enabled:true, builtin:true },
  { id:'r-monthly', label:'毎月の点検日', date:'01', monthly:true, enabled:true, builtin:true },
];

function defaultData(){
  return {
    pin: null,
    cards: [],
    reminders: DEFAULT_REMINDERS,
    customEmergencyNote: '',
    createdAt: todayISO(),
  };
}

function loadData(){
  const d = storage.get(STORE_KEY, null);
  if(!d) return defaultData();
  return { ...defaultData(), ...d, reminders: d.reminders && d.reminders.length ? d.reminders : DEFAULT_REMINDERS };
}
function saveData(data){ storage.set(STORE_KEY, data); }

/* ============== 画像圧縮 ============== */
function compressImage(file, maxWidth){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxWidth){
          h = Math.round(h * (maxWidth / w));
          w = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try{
          const dataUrl = canvas.toDataURL('image/jpeg', 0.78);
          resolve(dataUrl);
        }catch(err){ reject(err); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============== 共通UI部品 ============== */
function BigButton({ children, onClick, tone='sage', className='', disabled }){
  const tones = {
    sage: 'bg-[--sage] hover:bg-[--sage-dark] text-white',
    outline: 'bg-white border-2 border-[--sage] text-[--sage-dark]',
    amber: 'bg-[--amber] text-white',
    danger: 'bg-[--danger] text-white',
    ghost: 'bg-transparent text-[--navy] underline',
  };
  return (
    <button
      disabled={disabled}
      onClick={onClick}
      className={`press tapbtn rounded-2xl px-5 py-3 font-bold text-base shadow-sm disabled:opacity-40 ${tones[tone]} ${className}`}
      style={ tone==='sage' ? {backgroundColor:'var(--sage)'} : tone==='amber' ? {backgroundColor:'var(--amber)'} : tone==='danger' ? {backgroundColor:'var(--danger)'} : {} }
    >
      {children}
    </button>
  );
}

function Toast({ message, onDone }){
  useEffect(() => {
    if(!message) return;
    const t = setTimeout(onDone, 2600);
    return () => clearTimeout(t);
  }, [message]);
  if(!message) return null;
  return (
    <div className="fixed left-1/2 -translate-x-1/2 bottom-24 z-[999] fade-in px-4 py-3 rounded-xl bg-[--navy] text-white text-sm shadow-lg max-w-[90%] text-center" style={{backgroundColor:'var(--navy)'}}>
      {message}
    </div>
  );
}

function Modal({ open, onClose, title, children, wide }){
  if(!open) return null;
  return (
    <div className="fixed inset-0 z-[900] bg-black/40 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={onClose}>

        className={`fade-in bg-white w-full ${wide ? 'sm:max-w-lg' : 'sm:max-w-sm'} rounded-t-3xl sm:rounded-3xl max-h-[88vh] overflow-y-auto p-5`}
        onClick={e => e.stopPropagation()}

          <button className="press tapbtn rounded-full text-2xl leading-none px-3" onClick={onClose} aria-label="閉じる">×</button>

}

/* ============== PWAインストール案内 ============== */
function useStandalone(){
  const [standalone, setStandalone] = useState(false);
  useEffect(() => {
    const check = () => {
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      setStandalone(isStandalone);
    };
    check();
    window.addEventListener('resize', check);
    return () => window.removeEventListener('resize', check);
  }, []);
  return standalone;
}

function isIOS(){
  return /iphone|ipad|ipod/i.test(window.navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function InstallBanner(){
  const standalone = useStandalone();
  const [deferred, setDeferred] = useState(null);
  const [dismissed, setDismissed] = useState(() => storage.get('sonaelog_install_dismissed', false));
  const [showIOSModal, setShowIOSModal] = useState(false);

  useEffect(() => {
    const handler = (e) => { e.preventDefault(); setDeferred(e); };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  if(standalone || dismissed) return null;
  const ios = isIOS();
  if(!deferred && !ios) return null;

  const dismiss = () => { setDismissed(true); storage.set('sonaelog_install_dismissed', true); };

  return (
    <>
      <div className="no-print fixed top-0 left-0 right-0 z-[800] safe-top" style={{backgroundColor:'var(--sage-dark)'}}>
        <div className="flex items-center justify-between gap-2 px-4 py-2 text-white text-sm">
          <span>📲 ホーム画面に追加すると、もっと使いやすくなります</span>
          <div className="flex items-center gap-2 shrink-0">
            <button
              className="press tapbtn bg-white/90 text-[--sage-dark] rounded-full px-3 py-1.5 font-bold text-sm"
              style={{color:'var(--sage-dark)'}}
              onClick={async () => {
                if(deferred){
                  deferred.prompt();
                  await deferred.userChoice;
                  setDeferred(null);
                  dismiss();
                } else if(ios){
                  setShowIOSModal(true);
                }
              }}
            >追加する</button>
            <button className="press tapbtn text-white/80 text-xl px-2" onClick={dismiss} aria-label="閉じる">×</button>
          </div>
        </div>
      </div>
      <Modal open={showIOSModal} onClose={() => { setShowIOSModal(false); dismiss(); }} title="ホーム画面への追加方法">
        <div className="space-y-4 text-[15px] leading-relaxed">
          <p>① 画面下（または上）の<span className="font-bold">共有アイコン「⎋」</span>をタップします。</p>
          <div className="rounded-xl bg-[--sand] p-4 text-center text-3xl" style={{backgroundColor:'var(--sand)'}}>⎋</div>
          <p>② メニューの中から<span className="font-bold">「ホーム画面に追加」</span>を選びます。</p>
          <div className="rounded-xl bg-[--sand] p-4 text-center" style={{backgroundColor:'var(--sand)'}}>➕ ホーム画面に追加</div>
          <p>③「追加」を押せば完了です。次回からアイコンをタップするだけで開けます。</p>
          <BigButton onClick={() => { setShowIOSModal(false); dismiss(); }} className="w-full">わかりました</BigButton>
        </div>
      </Modal>
    </>
  );
}

/* ============== PIN ロック ============== */
function PinPad({ onSubmit, subtitle }){
  const [val, setVal] = useState('');
  const push = (n) => { if(val.length<4){ const nv=val+n; setVal(nv); if(nv.length===4){ setTimeout(()=>{ onSubmit(nv); setVal(''); }, 120); } } };
  return (
    <div className="text-center">
      {subtitle && <p className="mb-4 text-sm text-[--navy]/70">{subtitle}</p>}
      <div className="flex justify-center gap-3 mb-6">
        {[0,1,2,3].map(i => (
          <div key={i} className="w-4 h-4 rounded-full border-2" style={{borderColor:'var(--sage)', backgroundColor: val.length>i ? 'var(--sage)' : 'transparent'}} />
        ))}
      </div>
      <div className="grid grid-cols-3 gap-3 max-w-[280px] mx-auto">
        {['1','2','3','4','5','6','7','8','9'].map(n => (
          <button key={n} className="press tapbtn h-16 rounded-2xl bg-white text-2xl font-bold shadow" onClick={() => push(n)}>{n}</button>
        ))}
        <div />
        <button className="press tapbtn h-16 rounded-2xl bg-white text-2xl font-bold shadow" onClick={() => push('0')}>0</button>
        <button className="press tapbtn h-16 rounded-2xl bg-white text-xl font-bold shadow" onClick={() => setVal(v => v.slice(0,-1))}>⌫</button>
      </div>
    </div>
  );
}

function LockScreen({ data, onUnlock }){
  const [stage, setStage] = useState(data.pin ? 'lock' : 'setup1');
  const [firstPin, setFirstPin] = useState('');
  const [error, setError] = useState('');

  if(stage === 'setup1' || stage === 'setup2'){
    return (
      <div className="min-h-screen flex flex-col justify-center items-center px-6 safe-top safe-bottom" style={{backgroundColor:'var(--sand)'}}>
        <div className="text-5xl mb-2">🛡️</div>
        <h1 className="text-2xl font-bold mb-1" style={{color:'var(--navy)'}}>ソナエログ</h1>
        <p className="text-sm text-[--navy]/60 mb-8">そなえあればうれしいアプリ</p>
        <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow">
          <p className="font-bold text-center mb-4">
            {stage==='setup1' ? '合言葉となる4つの数字を決めてください' : 'もう一度、同じ数字を入力してください'}
          </p>
          {error && <p className="text-center text-sm mb-2" style={{color:'var(--danger)'}}>{error}</p>}
          <PinPad onSubmit={(v) => {
            if(stage==='setup1'){ setFirstPin(v); setStage('setup2'); setError(''); }
            else{
              if(v===firstPin){ onUnlock(v, true); }
              else { setError('数字が違います。最初からやり直してください'); setStage('setup1'); }
            }
          }} />
        </div>
      </div>
    );
  }
  return (
    <div className="min-h-screen flex flex-col justify-center items-center px-6 safe-top safe-bottom" style={{backgroundColor:'var(--sand)'}}>
      <div className="text-5xl mb-2">🔒</div>
      <h1 className="text-2xl font-bold mb-8" style={{color:'var(--navy)'}}>ソナエログ</h1>
      <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow">
        <p className="font-bold text-center mb-4">合言葉の数字を入力してください</p>
        {error && <p className="text-center text-sm mb-2" style={{color:'var(--danger)'}}>{error}</p>}
        <PinPad onSubmit={(v) => {
          if(v === data.pin){ onUnlock(v, false); }
          else { setError('数字が違います'); }
        }} />
      </div>
    </div>
  );
}

/* ============== ホーム（平時モード） ============== */
function PhotoThumb({ photo, onRemove }){
  return (
    <div className="relative shrink-0 w-20 h-20 rounded-xl overflow-hidden border" style={{borderColor:'var(--line)'}}>
      <img src={photo.dataUrl} className="w-full h-full object-cover" />
      {onRemove && (
        <button onClick={onRemove} className="press absolute top-0.5 right-0.5 w-6 h-6 rounded-full bg-black/60 text-white text-xs">×</button>
      )}
      <div className="absolute bottom-0 left-0 right-0 bg-black/50 text-white text-[9px] text-center py-0.5">{photo.date ? photo.date.slice(5) : ''}</div>
    </div>
  );
}

function CapturePhotoButton({ label, onCapture, toast }){
  const fileInputRef = useRef(null);
  const cameraInputRef = useRef(null);
  const [busy, setBusy] = useState(false);

  const handleFiles = async (files) => {
    if(!files || !files[0]) return;
    setBusy(true);
    try{
      const dataUrl = await compressImage(files[0], 900);
      onCapture(dataUrl);
    }catch(e){
      toast('写真の読み込みに失敗しました。もう一度お試しください');
    }
    setBusy(false);
  };

  const tryCamera = async () => {
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      try{
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        stream.getTracks().forEach(t => t.stop());
        cameraInputRef.current.click();
      }catch(e){
        toast('カメラが使えないため、写真を選ぶ画面に切り替わります');
        setTimeout(() => fileInputRef.current.click(), 900);
      }
    }else{
      toast('カメラが使えないため、写真を選ぶ画面に切り替わります');
      setTimeout(() => fileInputRef.current.click(), 900);
    }
  };

  return (
    <div>
      <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={e => handleFiles(e.target.files)} />
      <input ref={fileInputRef} type="file" accept="image/*" className="hidden" onChange={e => handleFiles(e.target.files)} />
      <BigButton tone="outline" className="w-full" disabled={busy} onClick={tryCamera}>
        {busy ? '読み込み中…' : `📷 ${label}`}
      </BigButton>
    </div>
  );
}

function ChecklistBlock({ items, onToggle, onAdd, onRemove }){
  const [newItem, setNewItem] = useState('');
  return (
    <div className="space-y-2">
      {items.map(it => (
        <label key={it.id} className="flex items-center gap-3 bg-white rounded-xl px-3 py-2.5 border" style={{borderColor:'var(--line)'}}>
          <input type="checkbox" checked={it.checked} onChange={() => onToggle(it.id)} className="w-5 h-5 accent-[--sage]" style={{accentColor:'var(--sage)'}} />
          <span className={`flex-1 text-sm ${it.checked ? 'line-through text-[--navy]/40' : ''}`}>{it.label}</span>
          {it.checked && <span className="text-xs font-bold" style={{color:'var(--sage-dark)'}}>済み</span>}
          <button onClick={() => onRemove(it.id)} className="press text-[--navy]/30 px-1" aria-label="削除">✕</button>
        </label>
      ))}
      <div className="flex gap-2">
        <input value={newItem} onChange={e=>setNewItem(e.target.value)} placeholder="チェック項目を追加"
          className="flex-1 rounded-xl border px-3 py-2 text-sm" style={{borderColor:'var(--line)'}} />
        <button className="press tapbtn rounded-xl px-4 font-bold text-white" style={{backgroundColor:'var(--sage)'}}
          onClick={() => { if(newItem.trim()){ onAdd(newItem.trim()); setNewItem(''); } }}>追加</button>
      </div>
    </div>
  );
}

function CardEditor({ card, onChange, onDelete, toast }){
  const [open, setOpen] = useState(false);
  const [nameEdit, setNameEdit] = useState(false);
  const [nameVal, setNameVal] = useState(card.name);

  const update = (patch) => onChange({ ...card, ...patch });

  return (
    <div className="bg-white rounded-2xl shadow-sm border" style={{borderColor:'var(--line)'}}>
      <button className="w-full flex items-center justify-between px-4 py-3 press" onClick={() => setOpen(o=>!o)}>
        <div className="flex items-center gap-2 text-left">
          <span className="text-xl">{card.type==='house' ? '🏠' : '🚗'}</span>
          <div>
            <div className="font-bold">{card.name}</div>
            <div className="text-xs text-[--navy]/50">記録写真 {card.beforePhotos.length}枚・チェック {card.checklist.filter(c=>c.checked).length}/{card.checklist.length}</div>
          </div>
        </div>
        <span className="text-[--navy]/40">{open ? '▲' : '▼'}</span>
      </button>
      {open && (
        <div className="px-4 pb-4 space-y-4 fade-in">
          <div className="flex items-center gap-2">
            {nameEdit ? (
              <>
                <input value={nameVal} onChange={e=>setNameVal(e.target.value)} className="flex-1 rounded-xl border px-3 py-2 text-sm" style={{borderColor:'var(--line)'}} />
                <BigButton className="!px-3 !py-2 text-sm" onClick={() => { update({name: nameVal || card.name}); setNameEdit(false); }}>保存</BigButton>
              </>
            ) : (
              <>
                <span className="text-sm text-[--navy]/60">名前を変える：</span>
                <button className="press text-sm underline" style={{color:'var(--sage-dark)'}} onClick={()=>setNameEdit(true)}>変更する</button>
              </>
            )}
          </div>

          <div>
            <p className="font-bold text-sm mb-2">✅ そなえのチェック</p>
            <ChecklistBlock
              items={card.checklist}
              onToggle={(id) => update({ checklist: card.checklist.map(c => c.id===id ? {...c, checked:!c.checked} : c) })}
              onAdd={(label) => update({ checklist: [...card.checklist, {id:uid(), label, checked:false}] })}
              onRemove={(id) => update({ checklist: card.checklist.filter(c=>c.id!==id) })}
            />
          </div>

          <div>
            <p className="font-bold text-sm mb-2">📸 無事な今の記録（ビフォー写真）</p>
            <div className="flex gap-2 overflow-x-auto pb-1 mb-2">
              {card.beforePhotos.map(p => (
                <PhotoThumb key={p.id} photo={p} onRemove={() => update({ beforePhotos: card.beforePhotos.filter(x=>x.id!==p.id) })} />
              ))}
            </div>
            <CapturePhotoButton
              label="写真をとる・えらぶ"
              toast={toast}
              onCapture={(dataUrl) => update({ beforePhotos: [...card.beforePhotos, { id: uid(), dataUrl, date: todayISO() }] })}
            />
          </div>

          <BigButton tone="ghost" onClick={() => { if(confirm(`「${card.name}」を削除しますか？写真も消えます`)) onDelete(); }}>このカードを削除する</BigButton>
        </div>
      )}
    </div>
  );
}

function HomeView({ data, setData, toast }){
  const addCard = (type) => {

/* ============== せってい ============== */
function SettingsView({ data, setData, toast, onChangePin, onResetPin }){
  const fileRef = useRef(null);
  const [addLabel, setAddLabel] = useState('');
  const [addDate, setAddDate] = useState('');

  const toggleReminder = (id) => setData(d => ({...d, reminders: d.reminders.map(r => r.id===id ? {...r, enabled:!r.enabled} : r)}));
  const removeReminder = (id) => setData(d => ({...d, reminders: d.reminders.filter(r=>r.id!==id)}));
  const addReminder = () => {
    if(!addLabel.trim() || !addDate) return;
    const md = addDate.slice(5); // MM-DD from YYYY-MM-DD
    setData(d => ({...d, reminders:[...d.reminders, {id:uid(), label:addLabel.trim(), date: md, monthly:false, enabled:true, builtin:false}]}));
    setAddLabel(''); setAddDate('');
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `ソナエログ_おまもりデータ_${todayISO()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('データを保存しました');
  };
  const importData = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try{
        const parsed = JSON.parse(e.target.result);
        if(!parsed || typeof parsed !== 'object') throw new Error('bad');
        setData(d => ({ ...defaultData(), ...parsed }));
        toast('データを読み込みました');
      }catch(err){
        toast('読み込みに失敗しました。正しいファイルかご確認ください');
      }
    };
    reader.readAsText(file);
  };

  return (
    <div className="px-4 pt-4 pb-8 space-y-6 fade-in">
      <h2 className="text-xl font-bold">せってい</h2>

      <section className="bg-white rounded-2xl p-4 shadow space-y-3">
        <p className="font-bold">🔔 点検日のお知らせ</p>
        <p className="text-xs text-[--navy]/50">この日になると「点検日です」とお知らせします</p>
        <div className="space-y-2">
          {data.reminders.map(r => (
            <div key={r.id} className="flex items-center justify-between bg-[--sand] rounded-xl px-3 py-2" style={{backgroundColor:'var(--sand)'}}>
              <div>
                <div className="font-bold text-sm">{r.label}</div>
                <div className="text-xs text-[--navy]/50">{r.monthly ? '毎月1日' : `毎年 ${r.date.replace('-','月')}日`}</div>
              </div>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => toggleReminder(r.id)}
                  className={`press tapbtn w-14 h-8 rounded-full relative transition-colors ${r.enabled ? '' : 'bg-gray-300'}`}
                  style={{ backgroundColor: r.enabled ? 'var(--sage)' : '#d1d5db' }}
                >
                  <span className="absolute top-1 w-6 h-6 rounded-full bg-white shadow transition-all" style={{ left: r.enabled ? '28px' : '4px' }} />
                </button>
                {!r.builtin && <button className="press text-[--navy]/30" onClick={()=>removeReminder(r.id)}>✕</button>}
              </div>
            </div>
          ))}
        </div>
        <div className="pt-2 border-t space-y-2" style={{borderColor:'var(--line)'}}>
          <p className="text-sm font-bold">記念日を追加する（誕生日など）</p>
          <div className="flex gap-2">
            <input value={addLabel} onChange={e=>setAddLabel(e.target.value)} placeholder="名前（例：家族の誕生日）" className="flex-1 rounded-xl border px-3 py-2 text-sm" style={{borderColor:'var(--line)'}} />
          </div>
          <div className="flex gap-2">
            <input type="date" value={addDate} onChange={e=>setAddDate(e.target.value)} className="flex-1 rounded-xl border px-3 py-2 text-sm" style={{borderColor:'var(--line)'}} />
            <button className="press tapbtn rounded-xl px-4 font-bold text-white" style={{backgroundColor:'var(--sage)'}} onClick={addReminder}>追加</button>
          </div>
        </div>
      </section>

      <section className="bg-white rounded-2xl p-4 shadow space-y-3">
        <p className="font-bold">🔐 合言葉（ロック番号）</p>
        <BigButton tone="outline" className="w-full" onClick={onChangePin}>合言葉を変える</BigButton>
        <BigButton tone="ghost" onClick={onResetPin}>合言葉を忘れた場合はこちら</BigButton>
      </section>

      <section className="bg-white rounded-2xl p-4 shadow space-y-3">
        <p className="font-bold">💾 データのお引越し</p>
        <p className="text-xs text-[--navy]/50">機種変更の前などに、記録をまとめて保存・読み込みできます</p>
        <BigButton className="w-full" onClick={exportData}>データを保存する（ダウンロード）</BigButton>
        <input ref={fileRef} type="file" accept="application/json" className="hidden" onChange={e => e.target.files[0] && importData(e.target.files[0])} />
        <BigButton tone="outline" className="w-full" onClick={()=>fileRef.current.click()}>データを読み込む（復元）</BigButton>
      </section>
    </div>
  );
}

/* ============== リマインダー判定 ============== */
function getTodaysReminders(reminders){
  const now = new Date();
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const dd = String(now.getDate()).padStart(2,'0');
  return reminders.filter(r => {
    if(!r.enabled) return false;
    if(r.monthly) return dd === '01';
    return r.date === `${mm}-${dd}`;
  });
}

function MainApp(){
  const [data, setDataRaw] = useState(loadData);
  const [unlocked, setUnlocked] = useState(false);
  const [tab, setTab] = useState('home');
  const [toastMsg, setToastMsg] = useState('');
  const [showReminder, setShowReminder] = useState(false);
  const [pendingReminders, setPendingReminders] = useState([]);
  const [changingPin, setChangingPin] = useState(false);

  const setData = useCallback((updater) => {
    setDataRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      saveData(next);
      return next;
    });
  }, []);

  const toast = (m) => setToastMsg(m);

  useEffect(() => {
    if(!unlocked) return;
    const key = 'sonaelog_last_reminder_check';
    const last = storage.get(key, '');
    const today = todayISO();
    const todays = getTodaysReminders(data.reminders);
    if(todays.length && last !== today){
      setPendingReminders(todays);
      setShowReminder(true);
      storage.set(key, today);
    }
  }, [unlocked]);

  if(!unlocked){
    return (
      <>
        <LockScreen data={data} onUnlock={(pin, isSetup) => {
          if(isSetup){ setData(d => ({...d, pin})); }
          setUnlocked(true);
        }} />
      </>
    );
  }

  if(changingPin){
    return (
      <div className="min-h-screen flex flex-col justify-center items-center px-6 safe-top safe-bottom" style={{backgroundColor:'var(--sand)'}}>
        <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow">
          <p className="font-bold text-center mb-4">新しい合言葉を入力してください</p>
          <PinPad onSubmit={(v) => { setData(d=>({...d, pin:v})); setChangingPin(false); toast('合言葉を変更しました'); }} />
          <BigButton tone="ghost" className="w-full mt-3" onClick={()=>setChangingPin(false)}>やめる</BigButton>
        </div>
      </div>
    );
  }

  const ViewComp = {
    home: <HomeView data={data} setData={setData} toast={toast} />,
    emergency: <EmergencyView data={data} setData={setData} toast={toast} />,
    summary: <SummaryView data={data} toast={toast} />,
    phone: <PhoneView />,
    settings: <SettingsView data={data} setData={setData} toast={toast}
      onChangePin={()=>setChangingPin(true)}
      onResetPin={()=>{ if(confirm('合言葉をリセットします。次回起動時に新しく設定できます。よろしいですか？')){ setData(d=>({...d, pin:null})); location.reload(); } }}
    />,
  }[tab];

  return (
    <div className="min-h-screen flex flex-col" style={{backgroundColor:'var(--sand)'}}>
      <InstallBanner />
      <header className="no-print safe-top sticky top-0 z-40 px-4 py-3 flex items-center gap-3 shadow-sm" style={{backgroundColor:'var(--sage-dark)'}}>
        <span className="text-2xl">🛡️</span>
        <div>
          <h1 className="text-white font-black text-lg leading-tight">ソナエログ</h1>
          <p className="text-white/70 text-xs leading-tight">そなえあればうれしいアプリ</p>
        </div>
      </header>

      <main className="flex-1 max-w-2xl w-full mx-auto">
        {ViewComp}
        <AppFooter />
      </main>

      <nav className="no-print sticky bottom-0 z-40 safe-bottom bg-white border-t grid grid-cols-5" style={{borderColor:'var(--line)'}}>
        {TABS.map(t => (
          <button key={t.key} onClick={()=>setTab(t.key)} className={`press tapbtn flex flex-col items-center justify-center py-2 gap-0.5 ${tab===t.key ? 'font-bold' : 'text-[--navy]/50'}`} style={{ color: tab===t.key ? 'var(--sage-dark)' : undefined }}>
            <span className="text-xl">{t.icon}</span>
            <span className="text-[10px]">{t.label}</span>
          </button>
        ))}
      </nav>

      {showReminder && <ReminderPopup reminders={pendingReminders} onClose={()=>setShowReminder(false)} />}
      <Toast message={toastMsg} onDone={()=>setToastMsg('')} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);

/* ============== Service Worker 登録 ============== */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
